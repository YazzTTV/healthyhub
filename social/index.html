<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HealthyHub · Assets Instagram</title>
    <style>
      :root {
        --cream: #faf7f0;
        --cream-deep: #f4efe4;
        --brand: #2f6d4e;
        --brand-deep: #1f4a36;
        --ink: #141b1f;
        --ink-mute: #6b757a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--cream-deep);
        font-family: Inter, "Helvetica Neue", Arial, sans-serif;
        color: var(--ink);
        padding: 48px 24px 80px;
        -webkit-font-smoothing: antialiased;
      }
      header {
        max-width: 1200px;
        margin: 0 auto 40px;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #e8f2ec;
        color: var(--brand-deep);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        padding: 6px 14px;
        border-radius: 999px;
        text-transform: uppercase;
      }
      .eyebrow::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--brand);
      }
      h1 {
        margin: 14px 0 6px;
        font-size: 40px;
        letter-spacing: -0.02em;
        font-weight: 600;
      }
      header p {
        margin: 0;
        color: var(--ink-mute);
        font-size: 15px;
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        gap: 32px;
      }
      .row {
        display: grid;
        gap: 24px;
      }
      .row-3 { grid-template-columns: repeat(3, 1fr); }
      .row-2 { grid-template-columns: repeat(2, 1fr); }
      @media (max-width: 980px) {
        .row-3, .row-2 { grid-template-columns: 1fr; }
      }
      figure {
        margin: 0;
        background: white;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(20,27,31,.05), 0 8px 22px rgba(20,27,31,.08);
        display: flex;
        flex-direction: column;
      }
      figure .visual {
        background: var(--cream);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      figure img {
        max-width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
      }
      figcaption {
        padding: 16px 20px;
        border-top: 1px solid rgba(20,27,31,.05);
      }
      figcaption strong {
        display: block;
        font-size: 14px;
        letter-spacing: -0.01em;
      }
      figcaption span {
        display: block;
        margin-top: 2px;
        color: var(--ink-mute);
        font-size: 12px;
      }
      .download {
        display: inline-block;
        margin-top: 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--brand-deep);
        text-decoration: none;
      }
      .download:hover { color: var(--brand); }

      .section-title {
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--brand-deep);
        margin: 24px 0 4px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="eyebrow">Brand kit Instagram</span>
      <h1>HealthyHub · assets visuels</h1>
      <p>Logo + 4 posts au format Instagram natif (4:5 portrait, 1080×1350 px). Tous les fichiers sont en SVG vectoriel — exporte en PNG via Figma, Sketch, Inkscape, ou un convertisseur en ligne.</p>
    </header>

    <main>
      <p class="section-title">Logo</p>
      <div class="row row-2">
        <figure>
          <div class="visual" style="background: var(--brand-deep);">
            <img src="logo-profile.svg" alt="Logo profile" style="width: 280px;" />
          </div>
          <figcaption>
            <strong>Profile picture · 1080×1080</strong>
            <span>Avatar Instagram, sera cropé en cercle</span>
            <a class="download" href="logo-profile.svg" download>↓ Télécharger SVG</a>
          </figcaption>
        </figure>
        <figure>
          <div class="visual" style="background: var(--cream);">
            <img src="logo-mark.svg" alt="Logo mark horizontal" style="width: 320px;" />
          </div>
          <figcaption>
            <strong>Wordmark horizontal</strong>
            <span>Pour overlay, signature, watermark sur posts photo</span>
            <a class="download" href="logo-mark.svg" download>↓ Télécharger SVG</a>
          </figcaption>
        </figure>
      </div>

      <p class="section-title">Posts feed · 1080×1350</p>
      <div class="row row-2">
        <figure>
          <div class="visual">
            <img src="post-01-manifesto.svg" alt="Post manifeste" />
          </div>
          <figcaption>
            <strong>Post 01 · Manifeste</strong>
            <span>Statement d'ouverture · « Manger sain, sans y passer 20 minutes. »</span>
            <a class="download" href="post-01-manifesto.svg" download>↓ Télécharger SVG</a>
          </figcaption>
        </figure>
        <figure>
          <div class="visual">
            <img src="post-02-map.svg" alt="Post map teaser" />
          </div>
          <figcaption>
            <strong>Post 02 · Map teaser</strong>
            <span>« Paris, 12h32. Tu as 45 min. » · drive vers la carte</span>
            <a class="download" href="post-02-map.svg" download>↓ Télécharger SVG</a>
          </figcaption>
        </figure>
        <figure>
          <div class="visual">
            <img src="post-03-pick.svg" alt="Post pick du jour" />
          </div>
          <figcaption>
            <strong>Post 03 · Pick du jour</strong>
            <span>Format récurrent · 1 spot avec score, kcal, protéines, distance</span>
            <a class="download" href="post-03-pick.svg" download>↓ Télécharger SVG</a>
          </figcaption>
        </figure>
        <figure>
          <div class="visual">
            <img src="post-04-lean.svg" alt="Post Lean & Light" />
          </div>
          <figcaption>
            <strong>Post 04 · Sélection Lean &amp; Light</strong>
            <span>Top 5 avec scores · save-bait pour la communauté lean</span>
            <a class="download" href="post-04-lean.svg" download>↓ Télécharger SVG</a>
          </figcaption>
        </figure>
        <figure>
          <div class="visual">
            <img src="post-06-stat.svg" alt="Post stat" />
          </div>
          <figcaption>
            <strong>Post 05 · Chiffre marquant</strong>
            <span>73% · construit l'autorité éditoriale + méthodo</span>
            <a class="download" href="post-06-stat.svg" download>↓ Télécharger SVG</a>
          </figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
