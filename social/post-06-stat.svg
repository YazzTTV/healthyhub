<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <rect width="1080" height="1350" fill="#FAF7F0"/>

  <!-- Eyebrow -->
  <g transform="translate(96, 130)">
    <circle cx="10" cy="18" r="8" fill="#2F6D4E"/>
    <text x="32" y="26" font-family="Inter, Helvetica Neue, Arial, sans-serif"
          font-size="22" font-weight="600" fill="#1F4A36" letter-spacing="3">CHIFFRE DE LA SEMAINE</text>
  </g>

  <!-- BIG stat -->
  <text x="540" y="640" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="400" font-weight="700" fill="#1F4A36" letter-spacing="-12">73%</text>

  <!-- Body -->
  <text x="540" y="800" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="40" font-weight="500" fill="#141B1F">des plats marketés « healthy »</text>
  <text x="540" y="858" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="40" font-weight="500" fill="#141B1F">ne le sont pas vraiment.</text>

  <!-- Divider -->
  <line x1="440" y1="940" x2="640" y2="940" stroke="#1F4A36" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Explainer -->
  <text x="540" y="1000" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="22" font-weight="400" fill="#3A4549">On note chaque adresse sur 5 critères :</text>
  <text x="540" y="1040" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="22" font-weight="600" fill="#1F4A36">fraîcheur · équilibre · transparence</text>
  <text x="540" y="1080" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="22" font-weight="600" fill="#1F4A36">cohérence · retours terrain</text>

  <text x="540" y="1140" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="18" font-weight="400" fill="#6B757A">Seuil minimum : 3,5/5. Sous ce score, pas de référencement.</text>

  <!-- Footer logo -->
  <g transform="translate(486, 1230)">
    <rect x="0" y="0" width="56" height="56" rx="13" fill="#1F4A36"/>
    <g stroke="#FAF7F0" stroke-width="3.2" stroke-linecap="round" fill="none">
      <line x1="13" y1="16" x2="13" y2="40"/>
      <line x1="22" y1="16" x2="22" y2="40"/>
      <line x1="13" y1="28" x2="22" y2="28"/>
      <line x1="34" y1="16" x2="34" y2="40"/>
      <line x1="43" y1="16" x2="43" y2="40"/>
      <line x1="34" y1="28" x2="43" y2="28"/>
    </g>
    <text x="76" y="38" font-family="Inter, Helvetica Neue, Arial, sans-serif"
          font-size="26" font-weight="600" fill="#141B1F" letter-spacing="-0.5">Healthy<tspan fill="#2F6D4E">Hub</tspan></text>
  </g>
</svg>
